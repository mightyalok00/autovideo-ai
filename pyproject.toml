[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",   # Line too long
    "W293",   # Blank line contains whitespace (inside HTML multiline strings)
    "BLE001", # Blind exception
    "S110",   # try-except-pass
    "ASYNC230",# blocking open in async
    "PLW0602",# global variable
    "PLW1510",# subprocess.run without check
]
