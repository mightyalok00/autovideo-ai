name: Generate Video (Cloud Dispatch)

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Video Topic (e.g. The Untold Story of Stoicism)"
        required: true
        default: "The Untold Origin Story of Stoicism & Dark Psychology"
        type: string
      niche:
        description: "Video Niche Category"
        required: true
        default: "stoicism"
        type: choice
        options:
          - stoicism
          - history
          - space
          - crime
          - finance
          - ai
          - horror
          - health
          - geopolitics
          - gaming
      duration:
        description: "Target Video Duration (Minutes)"
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "3"
          - "5"

jobs:
  build-and-generate:
    runs-on: ubuntu-latest
    name: Autonomous Video Production

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libmp3lame-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Autonomous Production Agent
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python -c "from autonomous_agent import run_agent; run_agent('${{ inputs.topic }}', duration_minutes=int('${{ inputs.duration }}'), niche_id='${{ inputs.niche }}')"

      - name: Upload Produced Master Video & Launch Package
        uses: actions/upload-artifact@v4
        with:
          name: video-production-${{ github.run_id }}
          path: |
            output/*.mp4
            output/*.jpg
            output/*.json
          retention-days: 14
